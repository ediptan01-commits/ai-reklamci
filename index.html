9<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Reklamcı</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f8;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 22px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
    }

    header p {
      margin-top: 7px;
      color: #cbd5e1;
    }

    .container {
      max-width: 650px;
      margin: 25px auto;
      padding: 0 16px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 18px;
      margin-bottom: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
    }

    h2 {
      margin-bottom: 18px;
      font-size: 20px;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #6366f1;
    }

    .upload {
      border: 2px dashed #c7d2fe;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      background: #eef2ff;
    }

    .upload input {
      border: none;
      padding: 0;
      margin-top: 10px;
    }

    #preview {
      max-width: 100%;
      max-height: 250px;
      margin-top: 15px;
      border-radius: 12px;
      display: none;
    }

    button {
      width: 100%;
      border: none;
      padding: 16px;
      border-radius: 12px;
      background: #4f46e5;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
    }

    button:hover {
      background: #4338ca;
    }

    #result {
      display: none;
    }

    .result-box {
      background: #f8fafc;
      padding: 15px;
      border-radius: 12px;
      margin-top: 12px;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    .loading {
      text-align: center;
      padding: 20px;
      display: none;
    }

    .badge {
      display: inline-block;
      background: #e0e7ff;
      color: #3730a3;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 13px;
      margin: 4px;
    }
  </style>
</head>

<body>

<header>
  <h1>AI Reklamcı</h1>
  <p>Ürününü ver, reklamını yapay zekâ hazırlasın.</p>
</header>

<div class="container">

  <div class="card">
    <h2>Ürününü Tanıt</h2>

    <label>Ürün fotoğrafı</label>

    <div class="upload">
      Fotoğrafını seç
      <input type="file" id="productImage" accept="image/*">
      <img id="preview">
    </div>

    <label>Ürün / Hizmet adı</label>
    <input id="productName" placeholder="Örn: Erkek Spor Ayakkabı">

    <label>Fiyat</label>
    <input id="price" placeholder="Örn: 2.499 TL">

    <label>Ürün açıklaması</label>
    <textarea id="description"
      placeholder="Ürünün özelliklerini yaz..."></textarea>

    <label>Hedef müşteri</label>
    <input id="target"
      placeholder="Örn: 18-40 yaş arası erkekler">

    <label>Reklam platformu</label>
    <select id="platform">
      <option>Instagram Reels</option>
      <option>TikTok</option>
      <option>YouTube Shorts</option>
      <option>Facebook</option>
    </select>

    <label>Reklam tarzı</label>
    <select id="style">
      <option>Profesyonel</option>
      <option>Enerjik</option>
      <option>Lüks</option>
      <option>Kampanya</option>
      <option>Dikkat çekici</option>
    </select>

    <button onclick="createAd()">
      REKLAMI OLUŞTUR
    </button>

    <div class="loading" id="loading">
      Reklam hazırlanıyor...
    </div>
  </div>

  <div class="card" id="result">

    <h2>Reklamın Hazır</h2>

    <span class="badge" id="resultPlatform"></span>
    <span class="badge" id="resultStyle"></span>

    <h3 style="margin-top:20px;">Başlık</h3>
    <div class="result-box" id="title"></div>

    <h3 style="margin-top:20px;">Slogan</h3>
    <div class="result-box" id="slogan"></div>

    <h3 style="margin-top:20px;">Video Senaryosu</h3>
    <div class="result-box" id="script"></div>

    <h3 style="margin-top:20px;">Reklam Açıklaması</h3>
    <div class="result-box" id="caption"></div>

    <h3 style="margin-top:20px;">Hashtagler</h3>
    <div class="result-box" id="hashtags"></div>

    <button onclick="createVideo()">
      🎬 VİDEOYU OLUŞTUR
    </button>

  </div>

</div>

<script>

const imageInput = document.getElementById("productImage");
const preview = document.getElementById("preview");

imageInput.addEventListener("change", function () {

  const file = this.files[0];

  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(e) {
    preview.src = e.target.result;
    preview.style.display = "block";
  };

  reader.readAsDataURL(file);

});

async function createAd() {
  const product = document.getElementById("productName").value.trim();
  const price = document.getElementById("price").value.trim();
  const description = document.getElementById("description").value.trim();
  const target = document.getElementById("target").value.trim();
  const platform = document.getElementById("platform").value;
  const style = document.getElementById("style").value;

  if (!product || !description) {
    alert("Lütfen ürün/hizmet adını ve açıklamasını gir.");
    return;
  }

  const loading = document.getElementById("loading");
  const result = document.getElementById("result");

  loading.style.display = "block";
  result.style.display = "none";

  try {
    const response = await fetch(
      "/api/generate",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          productName: product,
          price: price,
          description: description,
          targetCustomer: target,
          platform: platform,
          style: style
        })
      }
    );

    const data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error(
        data.error || "Reklam oluşturulamadı."
      );
    }

    const ad = data.result;

    document.getElementById("resultPlatform").textContent = platform;
    document.getElementById("resultStyle").textContent = style;

    document.getElementById("title").textContent =
      ad.baslik || "";

    document.getElementById("slogan").textContent =
      ad.slogan || "";

    document.getElementById("script").textContent =
      ad.senaryo || "";

    document.getElementById("caption").textContent =
      ad.aciklama || "";

    document.getElementById("hashtags").textContent =
      Array.isArray(ad.hashtagler)
        ? ad.hashtagler.join(" ")
        : "";

    result.style.display = "block";

  } catch (error) {
    console.error(error);

    alert(
      "Reklam oluşturulurken hata oluştu:\n\n" +
      error.message
    );

  } finally {
    loading.style.display = "none";
  }
}


function createVideo() {
  const product = document.getElementById("productName").value.trim();
  const description = document.getElementById("description").value.trim();
  const price = document.getElementById("price").value.trim();

  const videoWindow = window.open("", "_blank");

  if (!videoWindow) {
    alert("Video ekranını açmak için açılır pencereye izin ver.");
    return;
  }

  videoWindow.document.write(`
    <!DOCTYPE html>
    <html lang="tr">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <title>AI Reklamcı - Video</title>

      <style>
        * {
          box-sizing: border-box;
        }

        body {
          margin: 0;
          background: #000;
          color: white;
          font-family: Arial, sans-serif;
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          padding: 20px;
        }

        .video {
          width: min(100%, 420px);
          aspect-ratio: 9 / 16;
          background: linear-gradient(
            160deg,
            #111827,
            #312e81,
            #000
          );
          border-radius: 22px;
          position: relative;
          overflow: hidden;
          box-shadow: 0 0 40px rgba(99,102,241,.45);
          display: flex;
          flex-direction: column;
          justify-content: flex-end;
          padding: 28px;
        }

        .badge {
          position: absolute;
          top: 25px;
          left: 25px;
          background: rgba(255,255,255,.15);
          padding: 8px 13px;
          border-radius: 20px;
          font-size: 13px;
        }

        h1 {
          font-size: 30px;
          margin: 0 0 12px;
        }

        p {
          font-size: 17px;
          line-height: 1.5;
          margin: 7px 0;
        }

        .price {
          font-size: 24px;
          font-weight: bold;
          margin-top: 15px;
        }

        .cta {
          margin-top: 18px;
          background: white;
          color: #111827;
          padding: 14px;
          text-align: center;
          border-radius: 12px;
          font-weight: bold;
        }

        .test {
          margin-top: 15px;
          color: #aaa;
          font-size: 12px;
          text-align: center;
        }
      </style>
    </head>

    <body>

      <div class="video">

        <div class="badge">
          AI REKLAMCI
        </div>

        <div>

          <h1>
            ${product || "Ürününüz"}
          </h1>

          <p>
            ${description || "Ürününüzü şimdi keşfedin."}
          </p>

          ${
            price
              ? `<div class="price">${price}</div>`
              : ""
          }

          <div class="cta">
            ŞİMDİ KEŞFET
          </div>

        </div>

      </div>

      <div class="test">
        Ücretsiz video prototipi • AI Reklamcı
      </div>

    </body>
    </html>
  `);

  videoWindow.document.close();
}
  );

}

</script>

</body>
</html>
